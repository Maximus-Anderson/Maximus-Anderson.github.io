name: Build posts

on:
  push:
    branches: ["**"]
    paths:
      - "posts/**"
      - "build.py"
      - "index.html"
      - "styles.css"
      - "logic.js"
      - "car-viewer.js"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python build.py
      - name: Commit rebuilt pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html projects about resume
          if git diff --cached --quiet; then
            echo "pages unchanged"
          else
            git commit -m "Build posts into index.html and route pages"
            git push
          fi
